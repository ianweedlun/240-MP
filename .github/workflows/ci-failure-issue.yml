name: PR CI failure → GitHub issue

# When any PR CI workflow fails, automatically create a GitHub issue documenting
# the failure. Keeps the failure on the PR instead of hidden behind red CI cards.

on:
  workflow_run:
    workflows:
      - CI
      - CRT agent validation
      - Burst RC deploy (rc / restore)
      - Pi RC deploy (pre-merge PR test)
      - RC tarball rebuild (no deploy)
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  emit:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Extract PR number, head ref, failing jobs
        id: meta
        run: |
          set -euo pipefail
          PR_NUMS="$(gh api "repos/$GITHUB_REPOSITORY/pulls" --jq 'map(.number) | join(" ")')"
          HEAD_REF="${GITHUB_HEAD_REF}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "pull_numbers=$PR_NUMS" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "owner_repo=$OWNER_REPO" >> "$GITHUB_OUTPUT"

          JOBS_JSON="$(gh api "repos/$OWNER_REPO/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --jq 'map(select(.conclusion == "failure")) | map({name, html_url}) | .[] | "\(.name)\t\(.html_url)"')"
          echo "failing_jobs<<EOF" >> "$GITHUB_ENV"
          echo "$JOBS_JSON" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build issue body
        id: body
        run: |
          set -euo pipefail
          HEAD_REF="${{ steps.meta.outputs.head_ref }}"
          RUN_URL="${{ steps.meta.outputs.run_url }}"
          RUNNING="$(echo '${{ env.failing_jobs }}' | jq -r '.[] | "  - \u25b6 \(.name)  [run](\(.html_url))"')"
          BODY=$(cat <<EOF
          CI failed on a push to \`$HEAD_REF\` in PR #${{ steps.meta.outputs.pull_numbers }}.

          - Workflow run: [$(github.event.workflow_run.name)]($RUN_URL)
          - Failing jobs:
            $RUNNING

          Fix the failing check and re-run. This issue is auto-generated.
          EOF
          )
          echo "body<<EOF" >> "$GITHUB_ENV"
          echo "$BODY" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue
        run: |
          set -euo pipefail
          OWNER_REPO="${{ steps.meta.outputs.owner_repo }}"
          TITLE="PR #${{ steps.meta.outputs.pull_numbers }} — CI failure on ${{ steps.meta.outputs.head_ref }} ($(date -u +%Y-%m-%d))"
          BODY="${{ env.body }}"
          gh issue create --repo "$OWNER_REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "ci-failure"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}