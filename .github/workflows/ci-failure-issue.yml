name: PR CI failure → GitHub issue

# When any PR CI workflow fails, automatically create a GitHub issue documenting
# the failure. Keeps the failure on the PR instead of hidden behind red CI cards.

on:
  workflow_run:
    workflows:
      - CI
      - CI macOS
      - CRT agent validation
      - Burst RC deploy (rc / restore)
      - Pi RC deploy (pre-merge PR test)
      - RC tarball rebuild (no deploy)
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  emit:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Collect failure metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_REPO: ${{ github.repository }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$OWNER_REPO/actions/runs/$WR_RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | {name, html_url}]' \
            > "$RUNNER_TEMP/failing_jobs.json"
          count="$(jq 'length' "$RUNNER_TEMP/failing_jobs.json")"
          echo "failing_job_count=$count" >> "$GITHUB_OUTPUT"
          echo "collected $count failing jobs for $OWNER_REPO run $WR_RUN_ID"

      - name: Build issue body
        id: body
        if: steps.meta.outputs.failing_job_count != '0'
        env:
          PR_NUMBERS: ${{ join(github.event.workflow_run.pull_requests.*.number, ', ') }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          running="$(jq -r '.[] | "  - ▶ [\(.name)](\(.html_url))"' \
            "$RUNNER_TEMP/failing_jobs.json")"
          {
            echo "CI failed for \`$WORKFLOW_NAME\` on \`$HEAD_REF\` ($HEAD_SHA) in \`$OWNER_REPO\`."
            echo
            if [ -n "${PR_NUMBERS:-}" ]; then
              echo "Associated PR(s): $PR_NUMBERS"
              echo
            fi
            echo "- Triggering run: [$WORKFLOW_NAME]($RUN_URL)"
            echo "- Failing jobs:"
            echo "$running"
            echo
            echo "Fix the failing check and re-run. This issue is auto-generated."
          } > "$RUNNER_TEMP/issue_body.md"

      - name: Create issue
        if: steps.meta.outputs.failing_job_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ join(github.event.workflow_run.pull_requests.*.number, ', ') }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y-%m-%d)"
          if [ -n "${PR_NUMBERS:-}" ]; then
            title="PR #$PR_NUMBERS — CI failure on $HEAD_REF ($date)"
          else
            title="CI failure on $HEAD_REF — $WORKFLOW_NAME ($date)"
          fi
          # The ci-failure label does not exist in this repo; don't require it.
          gh issue create --repo "$OWNER_REPO" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/issue_body.md"
