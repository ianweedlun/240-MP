name: CI macOS

# macOS validation split out of ci.yml so Pi deployments never wait on mac
# builds (nothing about the arm64 Pi artifact depends on this lane). Same
# triggers as before, so this still runs per push for dev and feature branches.
#
# RUNNER CHOICE — evidence, not taste (2026-11-17):
# The lane spent its life on `macos-15` (GitHub hosted arm64) and died silently:
# 13 consecutive jobs between 2026-11-17T14:26Z and 16:13Z ended `cancelled`
# with ZERO steps executed and runner_name null, annotation:
#   "The job was not acquired by Runner of type hosted even after multiple attempts"
#   "Due to capacity constraints, jobs targeting macOS arm64 runners may experience
#    longer queue times."
# A dispatch-time probe of the four hosted labels settled it (run 44124734968):
#   macos-15-intel -> runner acquired in 11s, x86_64 / macOS 15.7.9 / Xcode 16.4, green
#   macos-14       -> arm64, cancelled immediately (same starved arm64 pool)
#   macos-15       -> arm64, acquired after 5m04s (and 10m04s on a later run)
#   macos-13       -> never acquired (retired image)
# Every starved arm64 job is cancelled at exactly 15m00s with no runner, so the
# arm64 pool is not absent, it is latency-unbounded: fine for an on-request
# build, useless as a per-push gate. Hence the per-push lane runs on
# `macos-15-intel` (x64), which allocates in seconds. NOTE:
# `runs-on: [macos-15, macos-14]` is NOT a fallback list — a label array is
# ANDed ("any runner that matches all of the specified values"), so it would
# never match anything.
#
# The arm64 lane survives as an OPT-IN job behind the `arch` dispatch input:
# Apple-Silicon coverage on request, and no arm64 leg on pushes at all. Job-level
# `continue-on-error` was tried first and does not work for this failure mode — a
# job cancelled before it ever starts still fails the run (run 44128689188:
# arm64 leg cancelled at 15m01s, run conclusion `failure`).
on:
  push:
    # burst/* work branches deliberately absent: lab/local only, CI runs when they merge into dev
    branches: [dev, 'feature/**']
    paths-ignore: ['**.md','**.yml'] # docs and CI-only pushes
  pull_request:
    # PR CI also on beta so the maintainer sees green before clicking merge (the gate).
    branches: [beta]
  # yml-only changes are filtered out by the push paths-ignore above, so a manual
  # trigger is the only way to exercise this lane without a code push.
  workflow_dispatch:
    inputs:
      arch:
        description: 'Which macOS arch to build (pushed builds are always x64)'
        type: choice
        default: x64
        options: [x64, arm64, both]

jobs:
  build-macos:
    name: macOS x64 (intel)
    if: github.event_name != 'workflow_dispatch' || inputs.arch != 'arm64'
    runs-on: macos-15-intel

    steps:
      # ccache lane (issue #32 spring-clean follow-through): the macOS lane kept
      # re-running from zero on identity re-pushes and re-queued PR builds - the
      # chronic bottleneck (mac runners intermittently refuse capacity). With a
      # persistent cache, an identity re-push or a PR/merge pair hits almost fully.
      # Paired with the CMake APP_VERSION fix (target-wide -D on the sha busted
      # EVERY TU per push; now only the 2 TUs that use it see it) - without that
      # fix any ccache lane is dead weight by construction.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: 240mp-ccache-macos-x64-${{ github.event_name }}-${{ github.ref_name }}
          restore-keys: |
            240mp-ccache-macos-x64-

      - name: Install ccache (brew unless preinstalled)
        run: |
          if ! command -v ccache >/dev/null 2>&1; then brew install ccache; fi
          mkdir -p "${RUNNER_TEMP}/ccache"
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "$GITHUB_ENV"

      # Native arch on purpose: the runner is x86_64, so no CMAKE_OSX_ARCHITECTURES
      # override (the old hardcoded arm64 was only correct on an Apple-Silicon host).
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Build and test core
        uses: ./.github/actions/build-and-test
        with:
          qt-host: mac
          qt-version: '6.7.3'
          qt-arch: clang_64
          apt-packages: ""
          build-sdl2-source: 'true'
          app-version: ${{ github.sha }}

      # Saved right after Build (not at workflow end): test/install steps must not
      # throw away the compile results, so the store step sits before them.
      - name: Save ccache
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -j4

      # MACOSX_BUNDLE is TRUE in CMakeLists, so the binary lives inside the .app.
      # if-no-files-found: error — the old `build/240mp` path matched nothing and
      # the step still reported success (upload-artifact only warns), so the lane
      # was green with no artifact at all.
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: 240mp-macos-x64
          path: build/240mp.app
          if-no-files-found: error
          retention-days: 5

  # Apple-Silicon coverage, on request only — never on a push. Hosted arm64
  # allocation is starvation-prone (see the header), and a job that is cancelled
  # before it ever gets a runner still fails the whole run: job-level
  # `continue-on-error` does NOT cover a pre-start cancel (proved by run
  # 44128689188 — arm64 leg cancelled at 15m01s with no runner, run conclusion
  # `failure`). So the arm64 leg is opt-in via the `arch` dispatch input: ask for
  # it, and "capacity said no" is a truthful red on a run you asked for, instead
  # of a red X on somebody's unrelated push.
  build-macos-arm64:
    name: macOS arm64 (on request)
    if: github.event_name == 'workflow_dispatch' && inputs.arch != 'x64'
    runs-on: macos-15

    steps:
      - name: Install ccache (brew unless preinstalled)
        run: |
          if ! command -v ccache >/dev/null 2>&1; then brew install ccache; fi
          mkdir -p "${RUNNER_TEMP}/ccache"
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "$GITHUB_ENV"

      # Native arch on purpose: the runner is Apple-Silicon, so no
      # CMAKE_OSX_ARCHITECTURES override.
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Build and test core
        uses: ./.github/actions/build-and-test
        with:
          qt-host: mac
          qt-version: '6.7.3'
          qt-arch: clang_64
          apt-packages: ""
          build-sdl2-source: 'true'
          app-version: ${{ github.sha }}

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: 240mp-macos-arm64
          path: build/240mp.app
          if-no-files-found: error
          retention-days: 5
