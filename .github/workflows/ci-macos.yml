name: CI macOS

# macOS arm64 validation split out of ci.yml so Pi deployments never wait on
# mac builds (macOS runners intermittently refuse capacity; nothing about the
# arm64 Pi artifact depends on them). Keep the same triggers so this still
# runs per push for dev and feature branches. The job body is verbatim from
# the original CI (AGL-pinned macos-15 etc. preserved).
on:
  push:
    # burst/* work branches deliberately absent: lab/local only, CI runs when they merge into dev
    branches: [dev, 'feature/**']
    paths-ignore: ['**.md','**.yml'] # docs and CI-only pushes
  pull_request:
    # PR CI also on beta so the maintainer sees green before clicking merge (the gate).
    branches: [beta]

jobs:
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      # ccache lane (issue #32 spring-clean follow-through): the macOS lane kept
      # re-running from zero on identity re-pushes and re-queued PR builds - the
      # chronic bottleneck (mac runners intermittently refuse capacity). With a
      # persistent cache, an identity re-push or a PR/merge pair hits almost fully.
      # Paired with the CMake APP_VERSION fix (target-wide -D on the sha busted
      # EVERY TU per push; now only the 2 TUs that use it see it) - without that
      # fix any ccache lane is dead weight by construction.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: 240mp-ccache-macos-arm64-${{ github.event_name }}-${{ github.ref_name }}
          restore-keys: |
            240mp-ccache-macos-arm64-

      - name: Install ccache (brew unless preinstalled)
        run: |
          if ! command -v ccache >/dev/null 2>&1; then brew install ccache; fi
          mkdir -p "${RUNNER_TEMP}/ccache"
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "$GITHUB_ENV"

      - name: Install SDL2 from source
        run: |
          SDL2_VERSION=2.32.10
          SRC="${RUNNER_TEMP}/SDL2-src"
          BUILD="${RUNNER_TEMP}/SDL2-build"
          git clone --depth 1 --branch "release-${SDL2_VERSION}" \
            https://github.com/libsdl-org/SDL "$SRC"
          cmake -S "$SRC" -B "$BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/sdl2-install" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build "$BUILD" --parallel
          cmake --install "$BUILD"
          echo "SDL2_PREFIX=${RUNNER_TEMP}/sdl2-install" >> "$GITHUB_ENV"

      - name: Configure (with tests)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${SDL2_PREFIX}" \
            -DBUILD_TESTS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAPP_VERSION="${{ github.sha }}"

      - name: Build
        run: cmake --build build --parallel

      # Saved right after Build (not at workflow end): test/install steps must not
      # throw away the compile results, so the store step sits before them.
      - name: Save ccache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -j4

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 240mp-macos-arm64
          path: build/240mp
          retention-days: 5
