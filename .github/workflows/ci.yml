name: CI

on:
  push:
    branches: [dev, 'feature/**']
    paths-ignore: ['**.md'] # docs-only pushes (.hermes.md syncs, changelogs, plans) don't queue builds
  pull_request:
    branches: [dev]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Linux arm64 — Raspberry Pi OS Trixie (Debian 13), native runner
  # ──────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6svg6 \
            qt6-svg-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-window \
            libdrm-dev \
            libssl-dev \
            libsdl2-dev \
            libpcsclite-dev

      - name: Configure (with tests)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DAPP_VERSION="${{ github.sha }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -j4

      - name: Install to staging prefix
        run: |
          cmake --install build --prefix "${GITHUB_WORKSPACE}/install/usr/local"

      - name: Create tarball with branch/commit naming
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          [ -z "$BRANCH" ] && BRANCH="main"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          # Sanitize branch name for filename (replace / with -)
          BRANCH_SAFE="${BRANCH//\//-}"
          TARBALL_NAME="240-MP-${BRANCH_SAFE}-linux-arm64-${SHORT_SHA}"
          tar -czf "${TARBALL_NAME}.tar.gz" -C install .
          echo "TARBALL_NAME=$TARBALL_NAME" >> $GITHUB_ENV

      - name: Upload Linux arm64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 240mp-linux-arm64
          path: build/240mp
          retention-days: 5

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-linux-arm64
          path: "${{ env.TARBALL_NAME }}.tar.gz"
          retention-days: 5

  # ──────────────────────────────────────────────────────────────────────────────
  # Linux x86_64 — catches QML/Quick breakage on the AppImage target
  # ──────────────────────────────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libdrm-dev \
            libssl-dev \
            libsdl2-dev \
            libpcsclite-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0

      - name: Configure (with tests)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DBUILD_TESTS=ON \
            -DAPP_VERSION="${{ github.sha }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -j4

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 240mp-linux-x86_64
          path: build/240mp
          retention-days: 5