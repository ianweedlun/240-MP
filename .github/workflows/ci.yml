name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # macOS arm64 — same Qt version as release, catches QML/Quick breakage
  # ──────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS arm64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install SDL2 from source
        run: |
          SDL2_VERSION=2.32.10
          SRC="${RUNNER_TEMP}/SDL2-src"
          BUILD="${RUNNER_TEMP}/SDL2-build"
          git clone --depth 1 --branch "release-${SDL2_VERSION}" \
            https://github.com/libsdl-org/SDL "$SRC"
          cmake -S "$SRC" -B "$BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/sdl2-install" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build "$BUILD" --parallel
          cmake --install "$BUILD"
          echo "SDL2_PREFIX=${RUNNER_TEMP}/sdl2-install" >> "$GITHUB_ENV"

      - name: Configure (with tests)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${SDL2_PREFIX}" \
            -DBUILD_TESTS=ON \
            -DAPP_VERSION="ci"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -j4

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 240mp-macos-arm64
          path: build/240mp
          retention-days: 5

  # ──────────────────────────────────────────────────────────────────────────────
  # Linux arm64 — Raspberry Pi OS Trixie (Debian 13), native runner
  # ──────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6svg6 \
            qt6-svg-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-window \
            libdrm-dev \
            libssl-dev \
            libsdl2-dev \
            libpcsclite-dev

      - name: Configure (with tests)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DAPP_VERSION="ci"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -j4

      - name: Install to staging prefix
        run: |
          cmake --install build --prefix "${GITHUB_WORKSPACE}/install/usr/local"

      - name: Create tarball
        run: |
          cd "${GITHUB_WORKSPACE}/install"
          tar -czf "${GITHUB_WORKSPACE}/240-MP-ci-linux-arm64.tar.gz" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 240mp-linux-arm64
          path: build/240mp
          retention-days: 5

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-linux-arm64
          path: 240-MP-ci-linux-arm64.tar.gz
          retention-days: 5

  # ──────────────────────────────────────────────────────────────────────────────
  # Linux x86_64 — catches QML/Quick breakage on the AppImage target
  # ──────────────────────────────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libdrm-dev \
            libssl-dev \
            libsdl2-dev \
            libpcsclite-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0

      - name: Configure (with tests)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DBUILD_TESTS=ON \
            -DAPP_VERSION="ci"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -j4

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 240mp-linux-x86_64
          path: build/240mp
          retention-days: 5
