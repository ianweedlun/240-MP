name: Deploy to Pi

on:
  workflow_run:
    workflows: ["CI"]
    branches: [beta]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Raspberry Pi
    # Beta-only deploy (issue #44 topology): dev pushes get CI but NEVER touch
    # the Pi; beta is the validated showcase and its builds are the only Pi
    # deploys. Ian's CI tidy moved the branch filter to the trigger level, but
    # trigger branches match PR-triggered CI runs too whose workflow_run payload
    # head_branch is the PR HEAD, not the base (observed on PR #51: a beta-headed
    # PR fired a deploy run with head 'beta'). Gate here on the trigger event so
    # only a genuine PUSH into beta deploys — never a pre-merge PR completion.
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Stage identity key (key-only auth, no password secrets)
        run: |
          umask 077
          cat > /tmp/pi_id <<'PIKEY'
          ${{ secrets.PI_SSH_IDENTITY }}
          PIKEY
          ssh-keygen -q -lf /tmp/pi_id

      - name: Re-skip fast path (same commit re-pushed = no transfer, no reboot)
        # The Pi carries ~/.240mp-last-deployed-rev (written after each verified
        # deploy). Gate key = the triggering CI head commit sha, taken straight from
        # the workflow_run event payload — no API call, because this workflow's
        # GITHUB_TOKEN is Actions/Metadata-scoped (repo /repos reads 404 there).
        # Same commit ⇒ same tree ⇒ byte-identical build output: the skip is never
        # wrong. Same TREE but a different commit re-deploys needlessly at worst —
        # the asymmetric failure we allow. (Never key this on binary md5: the tarball
        # also carries share/240mp QML assets.)
        run: |
          REV_SHA='${{ github.event.workflow_run.head_sha }}'
          if [ -z "$REV_SHA" ]; then echo "no head sha in event payload"; exit 1; fi
          echo "REV_SHA=$REV_SHA" >> $GITHUB_ENV
          SSH="ssh -p 2222 -i /tmp/pi_id -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes"
          CUR=$($SSH "cat \$HOME/.240mp-last-deployed-rev 2>/dev/null" || true)
          if [ "$CUR" = "$REV_SHA" ]; then
            echo "SKIP_DEPLOY=1" >> $GITHUB_ENV
            echo "Commit $REV_SHA already deployed and verified on the Pi — no transfer, no reboot."
          fi

      - name: Download arm64 tarball (REST)
        if: env.SKIP_DEPLOY != '1'
        run: |
          RUN_ID='${{ github.event.workflow_run.id }}'
          echo "Triggering CI run: $RUN_ID"
          RESP=$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ianweedlun/240-MP/actions/runs/$RUN_ID/artifacts")
          echo "First 400 bytes of artifacts response (diagnostic):"
          echo "$RESP" | head -c 400
          CID=$(echo "$RESP" | jq -r '.artifacts[] | select(.name=="tarball-linux-arm64") | .id' | head -1)
          DLURL=$(echo "$RESP" | jq -r '.artifacts[] | select(.name=="tarball-linux-arm64") | .archive_download_url' | head -1)
          if [ -z "$DLURL" ]; then echo "No tarball artifact in CI run $RUN_ID"; exit 1; fi
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$DLURL" > /tmp/artifact.zip
          echo "downloaded $(wc -c < /tmp/artifact.zip) bytes; file says: $(file -b /tmp/artifact.zip)"
          unzip -o /tmp/artifact.zip
          ls -la *.tar.gz

      - name: Verify tarball
        if: env.SKIP_DEPLOY != '1'
        run: |
          ls -la *.tar.gz
          file *.tar.gz
          # The Pi is aarch64 — a non-ARM binary becomes a boot loop via
          # 240mp-stop's poweroff-on-exit. Fail fast instead of bricking.
          TARBALL=$(ls *.tar.gz | head -1)
          # Extract header to check architecture
          tar -xzf "$TARBALL" -O ./usr/local/bin/240mp | file - | grep -q 'ARM aarch64' \
            || { echo "Error: tarball binary is not ARM aarch64"; exit 1; }
          LOCAL_MD5=$(tar -xzf "$TARBALL" -O ./usr/local/bin/240mp | md5sum | cut -d' ' -f1)
          echo "LOCAL_MD5=$LOCAL_MD5" >> $GITHUB_ENV

      - name: Get branch and commit from tarball filename
        if: env.SKIP_DEPLOY != '1'
        run: |
          TARBALL=$(ls *.tar.gz | head -1)
          # Extract branch and commit from filename like:
          # 240-MP-main-abc1234-linux-arm64.tar.gz
          BRANCH=$(echo "$TARBALL" | sed -E 's/240-MP-([a-zA-Z0-9_-]+)-linux-arm64.*/\1/')
          COMMIT=$(echo "$TARBALL" | sed -E 's/240-MP-[a-zA-Z_-]+-linux-arm64-([a-z0-9]+)\.tar.gz/\1/')
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV

      - name: Deploy via ghdeploy + root wrapper, then verify
        if: env.SKIP_DEPLOY != '1'
        # The Pi's own /usr/local/bin/240mp-ci-deploy (run via sudo, granted by
        # /etc/sudoers.d/240mp-ci) does the whole dance: clear ExecStopPost, VT-stop,
        # extract, restore override, reboot. Connection death from the reboot is expected.
        run: |
          HOST='${{ secrets.PI_SSH_HOSTNAME }}'
          USER='${{ secrets.PI_SSH_USERNAME }}'
          TARBALL=$(ls *.tar.gz | head -1)
          SSH="ssh -p 2222 -i /tmp/pi_id -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes"

          # If the Pi is off-network for the runner, stop after verify: the artifact +
          # ARM check already proved the build. Deploy from a local machine instead.
          if ! $SSH "$USER@$HOST" true 2>/tmp/ssh_err; then
            echo "Pi not reachable from runner (likely cold). Build verified; transfer skipped."
            echo "To land locally: ./scripts/deploy-pi.sh --latest $BRANCH"
            exit 0
          fi

          # Per-run unique path: concurrent deploy runs (force-push chains, dev+feature
          # in flight together) used to share one /tmp name and clobber each other's
          # upload mid-stream — corrupted hybrid binaries on the Pi.
          PI_PATH="/tmp/240mp-deploy-${REV_SHA}.tar.gz"
          echo "Uploading $TARBALL to $PI_PATH ..."
          scp -P 2222 -i /tmp/pi_id -o StrictHostKeyChecking=no -o PasswordAuthentication=no \
            "$TARBALL" "$USER@$HOST:$PI_PATH"

          # Wrapper refresh convention (2026-11-04): ghdeploy's sudo grants ONLY the
          # wrapper CALL (see /etc/sudoers.d/240mp-ci: NOPASSWD wrapper *). It can NEVER
          # `sudo install` a fresh copy — that sudo asks for a password (rc=1, silent-ish).
          # Wrapper LOGIC changes are refreshed out-of-band by a privileged shell (agent
          # ian route: sudo install -m 755 ... /usr/local/bin/240mp-ci-deploy) BEFORE the
          # wave that depends on them. The tarball may still carry the copy for reference.
          if $SSH "$USER@$HOST" "test -x /usr/local/bin/240mp-ci-deploy" 2>/dev/null; then
            echo "Wrapper present on Pi — invoking root-side dance"
          else
            echo "Wrapper MISSING on Pi — refresh via privileged shell first; deploy skipped"
            exit 1
          fi

          echo "Root-side dance via /usr/local/bin/240mp-ci-deploy (its systemctl reboot kills this ssh) ..."
          rc=0
          $SSH "$USER@$HOST" "sudo /usr/local/bin/240mp-ci-deploy $PI_PATH" || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 126 ]; then echo "auth/sudo refused (rc=$rc)"; exit 1; fi
          echo "wrapper call returned rc=$rc (connection death = rebooting, as expected)"

          echo "Verify loop: waiting for Pi to come back and run the new build ..."
          for i in $(seq 1 15); do
            sleep 20
            OUT=$($SSH "$USER@$HOST" "systemctl is-active 240mp.service; md5sum /opt/240mp/bin/240mp" 2>/dev/null) || continue
            echo "check $i:" "$(echo "$OUT" | tr '\n' ' ')"
            if echo "$OUT" | head -1 | grep -q '^active' && echo "$OUT" | grep -q "$LOCAL_MD5"; then
              # Record the deployed commit so a future re-push of it can skip
              # transfer+reboot (the fast path above). Best-effort: a marker miss
              # only costs a redundant future deploy, never a wrong skip.
              [ -n "${REV_SHA:-}" ] && $SSH "$USER@$HOST" "echo $REV_SHA > \$HOME/.240mp-last-deployed-rev" 2>/dev/null || true
              echo "DEPLOYED+VERIFIED: service active, binary md5 matches tarball ($COMMIT)"
              exit 0
            fi
          done
          echo "VERIFY FAILED: service active + md5 $LOCAL_MD5 not confirmed after 15 tries"
          exit 1
