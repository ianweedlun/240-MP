name: Deploy to Pi

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Raspberry Pi
    # Any dev or feature-branch CI completion triggers a deploy (no hand-maintained branch list).
    if: >-
      github.event.workflow_run.head_branch == 'dev' ||
      startsWith(github.event.workflow_run.head_branch, 'feature/')
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - name: Download arm64 tarball (REST)
        run: |
          RUN_ID='${{ github.event.workflow_run.id }}'
          echo "Triggering CI run: $RUN_ID"
          RESP=$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ianweedlun/240-MP/actions/runs/$RUN_ID/artifacts")
          echo "First 400 bytes of artifacts response (diagnostic):"
          echo "$RESP" | head -c 400
          CID=$(echo "$RESP" | jq -r '.artifacts[] | select(.name=="tarball-linux-arm64") | .id' | head -1)
          DLURL=$(echo "$RESP" | jq -r '.artifacts[] | select(.name=="tarball-linux-arm64") | .archive_download_url' | head -1)
          if [ -z "$DLURL" ]; then echo "No tarball artifact in CI run $RUN_ID"; exit 1; fi
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$DLURL" > /tmp/artifact.zip
          echo "downloaded $(wc -c < /tmp/artifact.zip) bytes; file says: $(file -b /tmp/artifact.zip)"
          unzip -o /tmp/artifact.zip
          ls -la *.tar.gz

      - name: Verify tarball
        run: |
          ls -la *.tar.gz
          file *.tar.gz
          # The Pi is aarch64 — a non-ARM binary becomes a boot loop via
          # 240mp-stop's poweroff-on-exit. Fail fast instead of bricking.
          TARBALL=$(ls *.tar.gz | head -1)
          # Extract header to check architecture
          tar -xzf "$TARBALL" -O ./usr/local/bin/240mp | file - | grep -q 'ARM aarch64' \
            || { echo "Error: tarball binary is not ARM aarch64"; exit 1; }

      - name: Get branch and commit from tarball filename
        run: |
          TARBALL=$(ls *.tar.gz | head -1)
          # Extract branch and commit from filename like:
          # 240-MP-main-abc1234-linux-arm64.tar.gz
          BRANCH=$(echo "$TARBALL" | sed -E 's/240-MP-([a-zA-Z0-9_-]+)-linux-arm64.*/\1/')
          COMMIT=$(echo "$TARBALL" | sed -E 's/240-MP-[a-zA-Z_-]+-linux-arm64-([a-z0-9]+)\.tar.gz/\1/')
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV

      - name: Deploy to Pi
        env:
          PI_HOST: ${{ secrets.PI_SSH_HOSTNAME }}
          PI_USER: ${{ secrets.PI_SSH_USERNAME }}
          PI_PASSWORD: ${{ secrets.PI_SSH_PASSWORD }}
        run: |
          TARBALL=$(ls *.tar.gz | head -1)
          echo "Deploying $TARBALL to $PI_USER@$PI_HOST (branch: $BRANCH, commit: $COMMIT)"

          # Stop service — use 240mp-terminal.service to stop 240mp.
          # 240mp-terminal.service is a getty on tty1. Starting it stops 240mp.service
          # because they compete for the same VT.
          # Also clear ExecStopPost to avoid poweroff when 240mp exits due to VT loss.
          echo "Stopping 240mp.service via 240mp-terminal.service..."
          sshpass -p "$PI_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "$PI_USER@$PI_HOST" \
            "echo -e '[Service]\nExecStopPost=' | sudo tee /etc/systemd/system/240mp.service.d/override.conf && \
             sudo systemctl daemon-reload && \
             sudo systemctl stop 240mp-terminal.service 2>/dev/null && \
             sudo systemctl start 240mp-terminal.service && \
             sleep 2"

          # Wait for service to stop (240mp-terminal takes the VT, forcing 240mp to exit)
          for i in $(seq 1 10); do
            if sshpass -p "$PI_PASSWORD" ssh -o StrictHostKeyChecking=no \
              "$PI_USER@$PI_HOST" \
              "systemctl is-active 240mp.service 2>/dev/null" | grep -q 'active'; then
              echo "Waiting for service to stop... ($i/10)"
              sleep 2
            else
              echo "Service stopped"
              break
            fi
          done

          # SCP tarball
          echo "Uploading tarball..."
          sshpass -p "$PI_PASSWORD" scp -o StrictHostKeyChecking=no \
            "$TARBALL" "$PI_USER@$PI_HOST:/tmp/240-MP-deploy.tar.gz"

          # Extract and deploy, then restore ExecStopPost
          echo "Extracting..."
          sshpass -p "$PI_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "$PI_USER@$PI_HOST" \
            "sudo tar -xzf /tmp/240-MP-deploy.tar.gz --strip-components=3 -C /opt/240mp && \
             sudo chown -R $PI_USER: /opt/240mp && \
             rm -f /tmp/240-MP-deploy.tar.gz && \
             echo -e '[Service]\nExecStopPost=+/usr/local/bin/240mp-stop' | sudo tee /etc/systemd/system/240mp.service.d/override.conf && \
             sudo systemctl daemon-reload && \
             sudo systemctl stop 240mp-terminal.service 2>/dev/null; true && \
             echo "Deploy complete for branch $BRANCH commit $COMMIT — restart 240mp.service manually or reboot"
