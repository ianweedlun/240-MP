name: Pi RC deploy (pre-merge PR test)

# On-demand pre-merge verification (contract 2026-11-07): beta stays the Pi's
# daily driver — PR code NEVER lands on the Pi unless the dev->beta PR carries
# the `pi-test` label. Label it = PR HEAD rebuild + RC deploy + reboot; the
# evidence (marker, md5, state-log boot line) is posted on the PR; Ian tests
# the un-merged bits on the CRT, then approves and merges himself — the
# existing beta-push deploy remains the ONLY official deploy path.
# If a labeled PR is CLOSED UNMERGED, the previous official beta build is
# auto-restored on the Pi (one extra reboot, Pi back to truth).
# Same one-deploy-at-a-time rule as everything else: never RC two PRs, never
# merge while an RC deploy is mid-flight.
# Same-repo PRs only (fork PRs get no secrets — our flow never opens fork PRs).

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, closed]

  # Build-only lane (card t_82f5ebb9). Rebuild a ref's RC tarball and archive it
  # WITHOUT touching the Pi. It exists because the only other way to exercise this
  # file is a real PR event, which reboots the Pi out from under a human's CRT test.
  # This lane never deploys, never writes a marker, and it deliberately names its
  # artifact `pi-rc-buildonly-<sha12>` instead of `pi-rc-tarball-<sha12>`: a second
  # compilation of the same ref has a different binary md5, so a probe that md5'd
  # this artifact against an installed binary would manufacture false drift — the
  # exact bug this card exists to kill.
  workflow_dispatch:
    inputs:
      mode:
        description: 'build-only (default) = artifact only; rc = deploy a burst/** ref; restore = return to the saved beta rev'
        required: true
        type: choice
        default: build-only
        options: [build-only, rc, restore]
      ref:
        description: 'Ref for build-only / rc (rc requires burst/**). Ignored for restore.'
        required: false

jobs:
  pi-gate:
    # Same pattern as pi-crt.yml: job-level `if` cannot read secrets, so a
    # cheap gate job decides -- fork-safe when no Pi SSH secrets exist.
    name: Pi SSH secrets gate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.PI_SSH_HOSTNAME }}" ] && [ -n "${{ secrets.PI_SSH_USERNAME }}" ] && [ -n "${{ secrets.PI_SSH_IDENTITY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  pi-rc:
    name: PR Pi verification (RC / restore)
    concurrency:
      group: pi-rc-deploy
      cancel-in-progress: false
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'beta' &&
      (
        (github.event.action != 'closed' &&
         contains(github.event.pull_request.labels.*.name, 'pi-test'))
        ||
        (github.event.action == 'closed' && !github.event.pull_request.merged)
      ) &&
      needs.pi-gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04-arm
    needs: pi-gate
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      AGENT_TOK: ${{ secrets.AGENT_GH_TOKEN }}

    steps:
      # The decide helper is a repo script, so it must be on disk before the
      # decide step. For pull_request events (opened/labeled/synchronize/closed)
      # the PR-head SHA is the ref whose pi-rc.yml defines this run — using it
      # keeps the helper and the workflow definition from the same commit.
      - name: Checkout PR head (decide helper)
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Stage identity key (key-only auth, no password secrets)
        run: |
          umask 077
          cat > /tmp/pi_id <<'PIKEY'
          ${{ secrets.PI_SSH_IDENTITY }}
          PIKEY
          ssh-keygen -q -lf /tmp/pi_id

      - name: Decide mode + target ref (rc = PR head, restore = Pi's saved rev)
        run: |
          PR='${{ github.event.pull_request.number }}'
          ACTION='${{ github.event.action }}'
          post_comment() { local b resp code; b=$(cat); resp=$(jq -n --arg b "$b" '{body:$b}' | curl -s -w "\nHTTP=%{http_code}" -X POST -H "Authorization: Bearer ${AGENT_TOK:-$GH_TOKEN}" -H "Content-Type: application/json" -d @- "https://api.github.com/repos/ianweedlun/240-MP/issues/$PR/comments"); echo "COMMENT-RESP: $(echo "$resp" | tail -c 300)"; code=$(echo "$resp" | tail -n 1 | cut -d= -f2); [ "$code" = 201 ] || { echo "COMMENT-POST-FAILED http=$code"; return 1; }; }
          # Delegate the decision to a repo script with unit tests (issue #91).
          # NEVER write PR_NUM to $GITHUB_ENV and then read $PR_NUM in this same
          # step: GITHUB_ENV only exports to LATER steps, so $PR_NUM here was an
          # unset (empty) shell var and a matching `pr-N` marker always read as
          # a mismatch -> MODE=skip silently won on PRs #89 and #90.
          if [ "$ACTION" != 'closed' ]; then
            bash scripts/pi-rc-decide.sh "$ACTION" "$PR" "" "" >> "$GITHUB_ENV"
            echo "REF=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            exit 0
          fi

          # closed & unmerged: only this PR gets restored, and only if it
          # actually RC-deployed (marker carries the owning PR number).
          SSH_HOST='${{ secrets.PI_SSH_HOSTNAME }}'
          SSH_USER='${{ secrets.PI_SSH_USERNAME }}'
          SSH="ssh -p 2222 -i /tmp/pi_id -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes $SSH_USER@$SSH_HOST"
          RC_PR=$($SSH "cat \$HOME/.240mp-rc-deployed-pr 2>/dev/null" || true)
          REV=$($SSH "cat \$HOME/.240mp-rc-restore-rev 2>/dev/null" || true)
          echo "RC marker read from Pi: '$RC_PR' (want 'pr-$PR'); restore rev: '$REV'"
          DECISION=$(bash scripts/pi-rc-decide.sh "$ACTION" "$PR" "$RC_PR" "$REV")
          echo "$DECISION" >> "$GITHUB_ENV"
          if echo "$DECISION" | grep -q '^SKIP_REASON=unknown-rev$'; then
            echo "PR closed without merge but the Pi carried its RC build; **auto-restore target unknown** — land beta manually: ./scripts/deploy-pi.sh --latest beta" | post_comment
          fi

      - name: Checkout PR head (rc mode)
        if: env.MODE == 'rc'
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout saved beta rev (restore mode)
        if: env.MODE == 'restore'
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.REF }}

      - name: Build arm64 (same recipe as ci.yml)
        if: env.MODE != 'skip'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake qt6-base-dev qt6-declarative-dev libqt6svg6 qt6-svg-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-window \
            libdrm-dev libfontconfig1-dev libssl-dev libsdl2-dev libpcsclite-dev libqt6sql6 libqt6sql6-sqlite ccache
          # APP_VERSION is set by the tested decide helper: "<PR>-pi-rc" for an
          # RC deploy, or the saved official rev for a restore. The latter is
          # what ci.yml stamps on the beta build (github.sha), so the restored
          # binary is byte-identical to official beta, md5 included.
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DAPP_VERSION="${{ env.APP_VERSION }}"
          cmake --build build --parallel 4
          cmake --install build --prefix "${GITHUB_WORKSPACE}/install/usr/local"
          mkdir -p install/scripts && cp scripts/240mp-ci-deploy.sh install/scripts/
          TARBALL="240-MP-pi-rc-${{ github.event.pull_request.number }}-linux-arm64-$(git rev-parse --short HEAD)"
          tar -czf "${TARBALL}.tar.gz" -C install .
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "ARTIFACT_SHA=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV

      # t_82f5ebb9: until this step existed the tarball only ever existed on the Pi,
      # and only until 240mp-ci-deploy `rm -f`'d it — so an RC binary's md5 lived in
      # a job log and nowhere else. Named by sha (not by run) so a probe can look up
      # the artifact of the rev the markers name. This artifact is the binary the
      # deploy step installs (same build, same run), which is what makes the Pi's
      # .240mp-rc-deployed-md5 checkable; the build-only lane's artifact is not.
      - name: Upload RC tarball (sha-addressed artifact)
        if: env.MODE != 'skip'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pi-rc-tarball-${{ env.ARTIFACT_SHA }}
          path: ${{ env.TARBALL }}.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Deploy to Pi (RC or restore) + verify
        if: env.MODE != 'skip'
        run: |
          MODE="${{ env.MODE }}"; PR="${{ env.PR }}"; REF="${{ env.REF }}"; PR_NUM="pr-$PR"
          TARBALL="${{ env.TARBALL }}"
          post_comment() { local b resp code; b=$(cat); resp=$(jq -n --arg b "$b" '{body:$b}' | curl -s -w "\nHTTP=%{http_code}" -X POST -H "Authorization: Bearer ${AGENT_TOK:-$GH_TOKEN}" -H "Content-Type: application/json" -d @- "https://api.github.com/repos/ianweedlun/240-MP/issues/$PR/comments"); echo "COMMENT-RESP: $(echo "$resp" | tail -c 300)"; code=$(echo "$resp" | tail -n 1 | cut -d= -f2); [ "$code" = 201 ] || { echo "COMMENT-POST-FAILED http=$code"; return 1; }; }
          HOST='${{ secrets.PI_SSH_HOSTNAME }}'
          USER='${{ secrets.PI_SSH_USERNAME }}'
          SSH="ssh -p 2222 -i /tmp/pi_id -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes $USER@$HOST"
          LOCAL_MD5=$(tar -xzf "$TARBALL".tar.gz -O ./usr/local/bin/240mp | md5sum | cut -d' ' -f1)

          if ! $SSH true 2>/tmp/ssh_err; then
            echo "**Pi offline.** Build for $MODE verified locally (md5 $LOCAL_MD5) but NOT deployed — land manually when it's back: ./scripts/deploy-pi.sh" | post_comment
            exit 0
          fi

          if [ "$MODE" = "rc" ]; then
            RC_REV=$($SSH "cat \$HOME/.240mp-rc-deployed-rev 2>/dev/null" || true)
            if [ "$RC_REV" = "$REF" ]; then
              echo "RC fast-path: this exact PR head is already the RC build on the Pi — no transfer, no reboot, no duplicate comment."
              exit 0
            fi
            OFFICIAL=$($SSH "cat \$HOME/.240mp-last-deployed-rev 2>/dev/null" || true)
            [ -n "$OFFICIAL" ] && $SSH "echo $OFFICIAL > \$HOME/.240mp-rc-restore-rev" || true
          fi
          # Restore mode ALWAYS redeploys. The decide step already confirmed
          # this PR owns the Pi's RC marker, and RC deploys deliberately never
          # touch .240mp-last-deployed-rev — so the old "official marker still
          # equals REF" fast path fired for every real RC build and cleared the
          # markers while leaving the RC binary installed (issue #91).

          PI_PATH="/tmp/240mp-rc-$REF.tar.gz"
          scp -P 2222 -i /tmp/pi_id -o StrictHostKeyChecking=no -o PasswordAuthentication=no \
            "$TARBALL".tar.gz "$USER@$HOST:$PI_PATH"

          $SSH "test -x /usr/local/bin/240mp-ci-deploy" 2>/dev/null || {
            echo "Pi wrapper /usr/local/bin/240mp-ci-deploy MISSING — refresh via privileged shell, then re-fire the trigger." | post_comment
            exit 1
          }
          rc=0
          $SSH "sudo /usr/local/bin/240mp-ci-deploy $PI_PATH" || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 126 ]; then echo "auth/sudo refused (rc=$rc)"; exit 1; fi
          echo "wrapper call rc=$rc (connection death = rebooting, as expected)"

          for i in $(seq 1 15); do
            sleep 20
            PI_MD5R=$($SSH "md5sum /opt/240mp/bin/240mp | cut -d' ' -f1" 2>/dev/null || true)
            APP_PID=$($SSH "pgrep -f '240mp/bin/240[m]p' | head -1" 2>/dev/null || true)
            echo "check $i: md5=$PI_MD5R pid=$APP_PID"
            if [ -n "$APP_PID" ] && [ "$PI_MD5R" = "$LOCAL_MD5" ]; then
              BOOT=$($SSH "tail -n 6 /tmp/240mp_state.log" 2>/dev/null || true)
              if [ "$MODE" = "rc" ]; then
                for j in $(seq 1 10); do
                  $SSH "echo $REF > \$HOME/.240mp-rc-deployed-rev && echo $PR_NUM > \$HOME/.240mp-rc-deployed-pr && echo $LOCAL_MD5 > \$HOME/.240mp-rc-deployed-md5" && break
                  echo "marker write attempt $j failed (Pi still settling), retry"; sleep 20
                done
                {
                  echo "### Pi RC deploy — PR $PR_NUM (**un-merged code on the Pi**)"
                  echo "- build: PR head \`$(git rev-parse HEAD)\` → Pi binary md5 \`$LOCAL_MD5\` (matches tarball), service **active**, verified loop"
                  echo "- previous official rev \`${OFFICIAL:-none}\` saved as restore target — closing this PR restores it automatically"
                  echo "- tarball archived as artifact \`pi-rc-tarball-\` + this commit's sha12 (14 d) — the md5 above is the artifact's binary"
                  echo "- boot state log: \`$(echo "$BOOT" | tr '\n' ' ')\`"
                  echo ""
                  echo "CRT test the PR's behaviors now: your word on the behaviors gates your approving review; merge = official deploy over this RC."
                } > /tmp/rc_body.md
              else
                for j in $(seq 1 10); do
                  $SSH "echo $REF > \$HOME/.240mp-last-deployed-rev && rm -f \$HOME/.240mp-rc-deployed-rev \$HOME/.240mp-rc-deployed-pr \$HOME/.240mp-rc-deployed-md5 \$HOME/.240mp-rc-restore-rev" && break
                  echo "restore marker write attempt $j failed (Pi still settling), retry"; sleep 20
                done
                {
                  echo "### Pi restored to official beta \`$REF\`"
                  echo "- PR closed without merge; Pi rebuilt to the saved rev, service active, md5 verified. Pi back on beta truth."
                } > /tmp/rc_body.md
              fi
              post_comment < /tmp/rc_body.md
              echo "DEPLOYED+VERIFIED ($MODE): service active, md5 matches"
              exit 0
            fi
          done
          echo "VERIFY FAILED: service active + md5 $LOCAL_MD5 not confirmed after 15 tries"
          exit 1

      - name: Evidence on skip modes
        if: env.MODE == 'skip' && github.event.action == 'closed' && !github.event.pull_request.merged
        run: |
          resp=$(jq -n --arg b "Closed without merge — this PR never put a build on the Pi; nothing to restore." '{body:$b}' | curl -s -w "\nHTTP=%{http_code}" -X POST -H "Authorization: Bearer ${AGENT_TOK:-$GH_TOKEN}" -H "Content-Type: application/json" -d @- "https://api.github.com/repos/ianweedlun/240-MP/issues/${{ github.event.pull_request.number }}/comments"); echo "COMMENT-RESP: $(echo "$resp" | tail -c 300)"; code=$(echo "$resp" | tail -n 1 | cut -d= -f2); [ "$code" = 201 ] || { echo "COMMENT-POST-FAILED http=$code"; exit 1; }

  # ──────────────────────────────────────────────────────────────────────────────
  # Burst RC lane — workflow_dispatch rc/restore, ONE RC at a time (owner-aware)
  # ──────────────────────────────────────────────────────────────────────────────
  # Overnight torture cards cannot open a second dev→beta PR while another RC
  # PR owns the Pi. This lane deploys a burst/** ref as an RC instead, writes a
  # `burst:` owner marker (so PR close/restore never mistakes it for its own
  # RC), and restore mode returns the Pi to the saved official beta rev.
  # `concurrency: pi-rc-deploy` is shared with the PR lane above — no two
  # RC/restore deploys can ever overlap. No public GitHub comments: evidence
  # goes to the job summary and the card via the local operator.
  burst-rc:
    name: Burst RC deploy (rc / restore)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'rc' || inputs.mode == 'restore') &&
      needs.pi-gate.outputs.ready == 'true'
    concurrency:
      group: pi-rc-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    needs: pi-gate
    permissions:
      contents: read
    env:
      MODE: ${{ inputs.mode }}
      REF: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
      AGENT_TOK: ${{ secrets.AGENT_GH_TOKEN }}

    steps:
      - name: Stage identity key (key-only Pi auth)
        run: |
          umask 077
          cat > /tmp/pi_id <<'PIKEY'
          ${{ secrets.PI_SSH_IDENTITY }}
          PIKEY
          ssh-keygen -q -lf /tmp/pi_id

      - name: Decide mode / checkout ref / owner
        id: burst_decide
        run: |
          set -euo pipefail
          MODE="$MODE"
          REF="$REF"
          HOST="${{ secrets.PI_SSH_HOSTNAME }}"
          USER="${{ secrets.PI_SSH_USERNAME }}"
          SSH="ssh -p 2222 -i /tmp/pi_id -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes $USER@$HOST"

          case "$MODE" in
            rc)
              case "$REF" in
                burst/*) ;;
                *) echo "::error::rc mode requires a burst/** ref, got '$REF'" >&2; exit 1 ;;
              esac
              SAFE=$(printf '%s' "$REF" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')
              echo "CHECKOUT_REF=$REF" >> "$GITHUB_ENV"
              echo "APP_VERSION=burst-$SAFE-pi-rc" >> "$GITHUB_ENV"
              ;;
            restore)
              OWNER=$($SSH "cat \$HOME/.240mp-rc-deployed-pr 2>/dev/null" || true)
              case "$OWNER" in
                burst:*) ;;
                *) echo "::error::restore refused — Pi RC marker is '$OWNER', not a burst owner" >&2; exit 1 ;;
              esac
              RESTORE_REV=$($SSH "cat \$HOME/.240mp-rc-restore-rev 2>/dev/null" || true)
              if [ -z "$RESTORE_REV" ]; then
                echo "::error::restore refused — no saved restore rev on Pi" >&2
                exit 1
              fi
              echo "CHECKOUT_REF=$RESTORE_REV" >> "$GITHUB_ENV"
              echo "RESTORE_REV=$RESTORE_REV" >> "$GITHUB_ENV"
              echo "APP_VERSION=$RESTORE_REV" >> "$GITHUB_ENV"
              CURRENT_BETA=$($SSH "cat \$HOME/.240mp-last-deployed-rev 2>/dev/null" || true)
              if [ "$CURRENT_BETA" != "$RESTORE_REV" ]; then
                echo "Burst restore is a NO-OP: beta advanced from $RESTORE_REV to $CURRENT_BETA while the RC was active." >> "$GITHUB_STEP_SUMMARY"
                echo "SKIP_RESTORE=1" >> "$GITHUB_ENV"
                echo "skip=1" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Clear burst markers when beta already advanced
        if: steps.burst_decide.outputs.skip == '1'
        run: |
          HOST="${{ secrets.PI_SSH_HOSTNAME }}"
          USER="${{ secrets.PI_SSH_USERNAME }}"
          SSH="ssh -p 2222 -i /tmp/pi_id -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes $USER@$HOST"
          $SSH "rm -f \$HOME/.240mp-rc-deployed-rev \$HOME/.240mp-rc-deployed-pr \$HOME/.240mp-rc-deployed-md5 \$HOME/.240mp-rc-restore-rev"

      - name: Checkout decided ref
        if: steps.burst_decide.outputs.skip != '1'
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Build arm64 (burst RC / restore recipe)
        if: steps.burst_decide.outputs.skip != '1'
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake qt6-base-dev qt6-declarative-dev libqt6svg6 qt6-svg-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-window \
            libdrm-dev libfontconfig1-dev libssl-dev libsdl2-dev libpcsclite-dev libqt6sql6 libqt6sql6-sqlite ccache
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DAPP_VERSION="${{ env.APP_VERSION }}"
          cmake --build build --parallel 4
          cmake --install build --prefix "${GITHUB_WORKSPACE}/install/usr/local"
          mkdir -p install/scripts && cp scripts/240mp-ci-deploy.sh install/scripts/
          sha12=$(git rev-parse --short=12 HEAD)
          TARBALL="240-MP-burst-${{ env.MODE }}-linux-arm64-$sha12"
          tar -czf "${TARBALL}.tar.gz" -C install .
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "ARTIFACT_SHA=$sha12" >> "$GITHUB_ENV"

      - name: Upload burst tarball (sha-addressed, md5-checkable)
        if: steps.burst_decide.outputs.skip != '1'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pi-rc-tarball-${{ env.ARTIFACT_SHA }}
          path: ${{ env.TARBALL }}.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Deploy burst RC / restore to Pi + verify
        if: steps.burst_decide.outputs.skip != '1'
        run: |
          set -uo pipefail
          MODE="${{ env.MODE }}"
          REF="${{ env.CHECKOUT_REF }}"
          TARBALL="${{ env.TARBALL }}"
          HOST="${{ secrets.PI_SSH_HOSTNAME }}"
          USER="${{ secrets.PI_SSH_USERNAME }}"
          SSH="ssh -p 2222 -i /tmp/pi_id -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes $USER@$HOST"
          LOCAL_MD5=$(tar -xzf "$TARBALL".tar.gz -O ./usr/local/bin/240mp | md5sum | cut -d' ' -f1)
          SHA12=$(git rev-parse --short=12 HEAD)

          if ! $SSH true 2>/tmp/pi_unreachable; then
            echo "::error::Pi unreachable — build verified locally (md5 $LOCAL_MD5) but NOT deployed" >&2
            exit 1
          fi

          CURRENT_OWNER=$($SSH "cat \$HOME/.240mp-rc-deployed-pr 2>/dev/null" || true)
          if [ "$MODE" = 'rc' ]; then
            case "$CURRENT_OWNER" in
              burst:*) echo "::error::another burst RC is active ($CURRENT_OWNER); restore it first" >&2; exit 1 ;;
            esac
            OFFICIAL=$($SSH "cat \$HOME/.240mp-last-deployed-rev 2>/dev/null" || true)
            if [ -z "$OFFICIAL" ]; then
              echo "::error::no official beta rev on Pi; cannot save a restore target" >&2
              exit 1
            fi
            OWNER="burst:$REF@$SHA12"
          else
            OWNER="$CURRENT_OWNER"
          fi

          PI_PATH="/tmp/240mp-burst-$SHA12.tar.gz"
          scp -P 2222 -i /tmp/pi_id -o StrictHostKeyChecking=no -o PasswordAuthentication=no \
            "$TARBALL".tar.gz "$USER@$HOST:$PI_PATH" || { echo "::error::scp failed" >&2; exit 1; }
          rc=0
          $SSH "sudo /usr/local/bin/240mp-ci-deploy $PI_PATH" || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 126 ]; then
            echo "::error::auth/sudo refused (rc=$rc)" >&2
            exit 1
          fi
          echo "wrapper rc=$rc (connection death expected on reboot)"

          VERIFIED=0
          for i in $(seq 1 15); do
            sleep 20
            PI_MD5R=$($SSH "md5sum /opt/240mp/bin/240mp | cut -d' ' -f1" 2>/dev/null || true)
            APP_PID=$($SSH "pgrep -f '240mp/bin/240[m]p' | head -1" 2>/dev/null || true)
            echo "check $i: md5=$PI_MD5R pid=$APP_PID"
            if [ -n "$APP_PID" ] && [ "$PI_MD5R" = "$LOCAL_MD5" ]; then
              VERIFIED=1
              break
            fi
          done
          if [ "$VERIFIED" -ne 1 ]; then
            echo "::error::verify failed — service active + md5 $LOCAL_MD5 not confirmed after 15 tries" >&2
            exit 1
          fi

          BOOT=$($SSH "tail -n 6 /tmp/240mp_state.log 2>/dev/null" || true)
          if [ "$MODE" = 'rc' ]; then
            for i in $(seq 1 10); do
              $SSH "echo $SHA12 > \$HOME/.240mp-rc-deployed-rev && echo '$OWNER' > \$HOME/.240mp-rc-deployed-pr && echo $LOCAL_MD5 > \$HOME/.240mp-rc-deployed-md5 && echo $OFFICIAL > \$HOME/.240mp-rc-restore-rev" && break
              echo "marker write attempt $i failed; retrying"
              sleep 20
            done
          else
            for i in $(seq 1 10); do
              $SSH "echo $RESTORE_REV > \$HOME/.240mp-last-deployed-rev && rm -f \$HOME/.240mp-rc-deployed-rev \$HOME/.240mp-rc-deployed-pr \$HOME/.240mp-rc-deployed-md5 \$HOME/.240mp-rc-restore-rev" && break
              echo "marker clear attempt $i failed; retrying"
              sleep 20
            done
          fi

          {
            echo "### Burst RC — $MODE"
            echo "- owner: \`$OWNER\`"
            echo "- ref: \`$REF\` (\`$SHA12\`)"
            echo "- Pi binary md5: \`$LOCAL_MD5\` (matches tarball), service active"
            echo "- boot state log: \`$(echo "$BOOT" | tr '\n' ' ')\`"
            if [ "$MODE" = 'rc' ]; then
              echo "- restore target: \`$OFFICIAL\` — dispatch mode=restore to put the Pi back on beta"
            else
              echo "- restored official beta rev \`$RESTORE_REV\`; RC markers cleared"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOYED+VERIFIED ($MODE): owner=$OWNER md5=$LOCAL_MD5"

  # ──────────────────────────────────────────────────────────────────────────────
  # Build-only lane — workflow_dispatch mode=build-only, ZERO Pi contact (card t_82f5ebb9)
  # ──────────────────────────────────────────────────────────────────────────────
  # Proves and services the artifact path without a deploy: same build recipe as
  # the deploy lane, tarball archived as `pi-rc-buildonly-<sha12>`, no ssh, no
  # scp, no wrapper call, no marker write. Never compare this artifact's binary
  # md5 to /opt/240mp/bin/240mp — only `pi-rc-tarball-<sha12>` comes from the
  # build that got installed.
  rc-buildonly:
    name: RC tarball rebuild (no deploy)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'build-only' || inputs.mode == '')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Validate build-only ref
        run: |
          if [ -z "${{ inputs.ref }}" ]; then
            echo "::error::build-only mode requires ref" >&2
            exit 1
          fi

      - name: Checkout requested ref
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.ref }}

      - name: Build arm64 (same recipe as ci.yml)
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake qt6-base-dev qt6-declarative-dev libqt6svg6 qt6-svg-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-window \
            libdrm-dev libfontconfig1-dev libssl-dev libsdl2-dev libpcsclite-dev libqt6sql6 libqt6sql6-sqlite ccache
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DAPP_VERSION="buildonly-pi-rc"
          cmake --build build --parallel 4
          cmake --install build --prefix "${GITHUB_WORKSPACE}/install/usr/local"
          mkdir -p install/scripts && cp scripts/240mp-ci-deploy.sh install/scripts/
          TARBALL="240-MP-pi-rc-buildonly-linux-arm64-$(git rev-parse --short HEAD)"
          tar -czf "${TARBALL}.tar.gz" -C install .
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "ARTIFACT_SHA=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV

      - name: Upload tarball (build-only artifact)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pi-rc-buildonly-${{ env.ARTIFACT_SHA }}
          path: ${{ env.TARBALL }}.tar.gz
          retention-days: 3
          if-no-files-found: error
