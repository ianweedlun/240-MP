name: Sync .hermes.md
on:
  push:
    branches: [dev]
    paths: ['.hermes.md']

permissions:
  contents: write

jobs:
  sync:
    name: Mirror .hermes.md + megacave mirror to all branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: dev

      - name: Sync .hermes.md to all branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # All remote branches except HEAD, main (upstream mirror), and dev (source).
          # for-each-ref emits clean names (no leading whitespace like git branch -r),
          # then we drop origin/ and exclude main (upstream mirror) and dev (source of truth).
          BRANCHES=$(git for-each-ref --format='%(refname)' refs/remotes/origin \
            | sed 's|^origin/||' | grep -v '^HEAD$' | grep -vE '^(main|dev)$')

          for BRANCH in $BRANCHES; do
            git show-ref --verify --quiet "refs/remotes/origin/$BRANCH" || continue

            # Skip branches whose doc blobs already match dev (both files)
            if git diff --quiet "origin/$BRANCH:.hermes.md" "origin/dev:.hermes.md" 2>/dev/null; then
              echo "$BRANCH: doc blobs already in sync"
              continue
            fi

            git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout "$BRANCH"

            git show "origin/dev:.hermes.md" > .hermes.md
            git add .hermes.md
            git commit -m "docs: sync .hermes.md from dev (auto-sync)"
            git push origin "$BRANCH"
            echo "$BRANCH: synced"
          done
