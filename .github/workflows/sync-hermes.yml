name: Sync .hermes.md

# .hermes.md is single-sourced on main (sanctioned exception to the
# main-branch rule). When it changes, mirror it into every other branch so
# agent instructions never drift. Branches never edit the file themselves,
# so the sync commit is always trivially clean — no force pushes needed.
on:
  push:
    branches: [main]
    paths: ['.hermes.md']

permissions:
  contents: write

jobs:
  sync:
    name: Mirror .hermes.md to all branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: main

      - name: Sync .hermes.md to all branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get list of all remote branches tracking main
          BRANCHES=$(git branch -r | grep -v HEAD | sed 's|origin/||' | grep -v '^main$')

          for BRANCH in $BRANCHES; do
            # Verify branch ref exists
            git show-ref --verify --quiet "refs/remotes/origin/$BRANCH" || continue

            # Skip branches whose .hermes.md already matches main (empty commits fail)
            if git diff --quiet "origin/$BRANCH:.hermes.md" "origin/main:.hermes.md" 2>/dev/null; then
              echo "$BRANCH: .hermes.md already in sync"
              continue
            fi

            # Always sync .hermes.md from main to this branch
            git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout "$BRANCH"

            git show "origin/main:.hermes.md" > .hermes.md
            git add .hermes.md
            git commit -m "docs: sync .hermes.md from main (auto-sync)"
            git push origin "$BRANCH"
            echo "$BRANCH: synced"
          done